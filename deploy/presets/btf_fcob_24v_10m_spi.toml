# PixelNode Configuration
# Preset: BTF-LIGHTING FCOB 576 LEDs/m 24V (10m) via Raspberry Pi SPI
# Total Pixels: 160 (36 LEDs/IC, 16 px/m * 10m = 160 ICs, 5,760 physical LEDs)
# Color Order: rgb | Voltage: 24V

[node]
name = "Stage-BTF-FCOB-24V"
show_lock = false

[network]
artnet = true
sacn = true
bind_ip = "0.0.0.0"

[web]
enabled = true
port = 8080
bind_ip = "0.0.0.0"

[audio]
enabled = true
listen_udp_port = 8765
timeout_ms = 500

[failsafe]
on_data_loss = "hold"
hold_timeout_sec = 10
fade_duration_sec = 3

[[output]]
id = "out1"
driver = "spi_ws281x"
device = "/dev/spidev0.0"
chip = "ws2811"
color_order = "rgb"
pixels = 160
psu_max_current_ma = 7000

[[fixture]]
output = "out1"
pixel_range = [0, 159]
personality = "preset_7ch"
white_mode = "rgb_blend"
universe_span = "per_170px"
universe = 1
address = 1

# ==============================================================================
# FIELD INSTALLATION & WIRING NOTES (BTF-LIGHTING FCOB 24V 10m)
# ==============================================================================
# Power:
#   - Supply: 24V DC regulated power supply (>= 8A / 200W recommended).
#   - Injection: Inject 24V and DC GND at BOTH ends (0m and 10m) to prevent voltage drop.
#   - If sustained 100% white is used, also inject at 5m midpoint.
#
# Signal & Ground:
#   - Common Ground: Connect 24V PSU DC negative to Raspberry Pi GND.
#   - Level Shift: Pi GPIO10 (3.3V) -> 74AHCT125 -> WS2811 DI (5V logic).
#   - Damping: Insert a 33-100 ohm series resistor on data line near level shifter.
#   - CAUTION: NEVER connect 24V DC to Raspberry Pi GPIO or 5V power rails!
# ==============================================================================
