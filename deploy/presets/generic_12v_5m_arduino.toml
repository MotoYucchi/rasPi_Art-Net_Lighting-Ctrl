# PixelNode Configuration
# Preset: Generic / No-brand 60 LEDs/m 12V (5m) via Arduino Uno USB-Serial
# Total Pixels: 100 (3 LEDs/IC, 20 px/m * 5m = 100 ICs, 300 physical LEDs)
# Color Order: rbg (Red, Blue, Green swapped batch) | Voltage: 12V

[node]
name = "Stage-Generic-12V-Arduino"
show_lock = false

[network]
artnet = true
sacn = true
bind_ip = "0.0.0.0"

[web]
enabled = true
port = 8080
bind_ip = "0.0.0.0"

[audio]
enabled = true
listen_udp_port = 8765
timeout_ms = 500

[failsafe]
on_data_loss = "hold"
hold_timeout_sec = 10
fade_duration_sec = 3

[[output]]
id = "out1"
driver = "serial_mcu"
device = "/dev/ttyUSB0"
baud_rate = 115200
chip = "ws2811"
color_order = "rbg"
pixels = 100
psu_max_current_ma = 6000

[[fixture]]
output = "out1"
pixel_range = [0, 99]
personality = "preset_7ch"
white_mode = "rgb_blend"
universe_span = "per_170px"
universe = 1
address = 1

# ==============================================================================
# FIELD INSTALLATION & WIRING NOTES (Generic 60 LED/m 12V 5m with Arduino Uno)
# ==============================================================================
# Power:
#   - Supply: 12V DC regulated power supply (>= 8A / 100W recommended).
#   - Injection: Inject 12V and DC GND at BOTH ends (0m and 5m).
#
# Signal & Ground:
#   - Common Ground: Connect 12V PSU DC negative to Arduino Uno GND pin.
#   - Data Line: Arduino Pin D6 -> 330 ohm series damping resistor -> Strip DI.
#   - Note: Color order is specifically "rbg".
#   - CAUTION: NEVER connect 12V DC to Arduino Uno 5V/VIN or data pins!
# ==============================================================================
